# Required for Docker Compose
global:
  scrape_interval: 5s # Scrape every 5 seconds for fast local testing

scrape_configs:
  - job_name: "weather-app"
    static_configs:
      # In Docker Compose, services talk to each other using their service names.
      # "backend:8080" matches the backend service definition above!
      - targets: ["backend:8080"]
