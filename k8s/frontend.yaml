apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-frontend
  labels:
    app: weather-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: weather-frontend

  template:
    metadata:
      labels:
        app: weather-frontend

    spec:
      containers:
        - name: frontend
          image: weather-frontend:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service

spec:
  type: NodePort

  selector:
    app: weather-frontend

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30000
